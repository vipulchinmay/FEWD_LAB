<!-- partners.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partners - E-Commerce</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/bootstrap-icons.css" rel="stylesheet" />
    <style>
      .partner-logo {
        filter: grayscale(100%);
        transition: all 0.3s ease;
        opacity: 0.7;
      }
      .partner-logo:hover {
        filter: grayscale(0%);
        opacity: 1;
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <!-- Navigation (Same as index.html) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="Home.html">
          <i class="bi bi-shop me-2"></i>E-Shop
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="Home.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="partners.html">Partners</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact Us</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Partners Section -->
    <div class="container py-5">
      <h2 class="text-center mb-5">Our Trusted Partners</h2>
      <div class="row text-center">
        <div class="col-md-3 col-6 mb-4">
          <img
            src="/images/eco.webp"
            alt="Partner 1"
            class="img-fluid partner-logo"
          />
        </div>
        <div class="col-md-3 col-6 mb-4">
          <img
            src="/images/image.png"
            alt="Partner 2"
            class="img-fluid partner-logo"
          />
        </div>
        <div class="col-md-3 col-6 mb-4">
          <img
            src="/images/power.webp"
            alt="Partner 3"
            class="img-fluid partner-logo"
          />
        </div>
        <div class="col-md-3 col-6 mb-4">
          <img
            src="/images/p.jpg"
            alt="Partner 4"
            class="img-fluid partner-logo"
          />
        </div>
      </div>

      <div class="row mt-5">
        <div class="col-md-12">
          <div class="card bg-light">
            <div class="card-body text-center">
              <h3>Become a Partner</h3>
              <p>
                Interested in partnering with E-Shop? We're always looking for
                innovative businesses.
              </p>
              <a href="contact.html" class="btn btn-primary"
                >Contact Our Partnership Team</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer (Same as index.html) -->
    <footer class="bg-dark text-white text-center py-4">
      <div class="container">
        <p class="mb-0">© 2025 E-Shop. All rights reserved.</p>
        <div class="social-links mt-3">
          <a href="#" class="text-white mx-2"><i class="bi bi-facebook"></i></a>
          <a href="#" class="text-white mx-2"><i class="bi bi-twitter"></i></a>
          <a href="#" class="text-white mx-2"
            ><i class="bi bi-instagram"></i
          ></a>
        </div>
      </div>
    </footer>

    <script src="/css/bootstrap.bundle.min.js"></script>
  </body>
</html>
